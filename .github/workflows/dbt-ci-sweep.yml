# Stale CI schema sweep for databricks/demos/dbt.
#
# CI teardown runs in-task (try/finally inside the Databricks CI job), so the
# only way to leak a schema is cancelling the Databricks run itself. This
# weekly trigger runs the same CI job in `ci-sweep` mode, which drops any
# leaked CI schemas older than 3 days.
#
# Same trigger-and-poll pattern and security model as dbt-ci.yml — GitHub only
# passes parameters; dbt executes in the Databricks job as its run_as SP.
name: dbt CI schema sweep

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    # Never run for forks / other actors — this schedules onto an in-workspace runner.
    if: github.repository == 'randypitcherii/shareables' && github.actor == 'randypitcherii'
    runs-on: [self-hosted, databricks-app]
    timeout-minutes: 30
    env:
      DBT_CI_JOB_NAME: rpw-dbt-databricks-reference CI
      DATABRICKS_CLI_VERSION: "1.3.0"

    steps:
      - name: Install Databricks CLI (user-space, cached)
        run: |
          : "${DATABRICKS_HOST:?not running on the Databricks App runner}"
          CLI_DIR="$HOME/.dbx-cli/$DATABRICKS_CLI_VERSION"
          if [ ! -x "$CLI_DIR/databricks" ]; then
            mkdir -p "$CLI_DIR"
            curl -fsSL -o "$CLI_DIR/cli.tar.gz" \
              "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.tar.gz"
            tar -xzf "$CLI_DIR/cli.tar.gz" -C "$CLI_DIR"
            rm -f "$CLI_DIR/cli.tar.gz"
          fi
          echo "$CLI_DIR" >> "$GITHUB_PATH"

      - name: Trigger sweep and wait
        run: |
          JOB_ID=$(databricks jobs list -o json --name "$DBT_CI_JOB_NAME" | python3 -c '
          import json, os, sys
          jobs = json.load(sys.stdin)
          name = os.environ["DBT_CI_JOB_NAME"]
          matches = [j["job_id"] for j in jobs if j["settings"]["name"] == name]
          if not matches:
              sys.exit(f"no job named {name!r} visible to the trigger service principal")
          print(matches[0])
          ')
          RUN_ID=$(databricks api post /api/2.2/jobs/run-now --json "{
            \"job_id\": $JOB_ID,
            \"job_parameters\": {\"mode\": \"ci-sweep\", \"git_ref\": \"main\"}
          }" | python3 -c 'import json, sys; print(json.load(sys.stdin)["run_id"])')

          # NB: keep this python free of escaped double quotes -- \" inside a
          # single-quoted python3 -c string is a SyntaxError that leaves the
          # loop spinning blind.
          STATUS_PY='
          import json, sys
          run = json.load(sys.stdin)
          state = run.get("status") or run.get("state") or {}
          term = state.get("termination_details") or {}
          print(state.get("state") or state.get("life_cycle_state") or "")
          print(term.get("code") or state.get("result_state") or "")
          print(run.get("run_page_url") or "")
          '
          while true; do
            OUT=$(databricks api get "/api/2.2/jobs/runs/get?run_id=$RUN_ID" | python3 -c "$STATUS_PY")
            LIFECYCLE=$(echo "$OUT" | sed -n 1p)
            RESULT=$(echo "$OUT" | sed -n 2p)
            RUN_URL=$(echo "$OUT" | sed -n 3p)
            echo "run $RUN_ID: ${LIFECYCLE:-unknown} ($RUN_URL)"
            case "$LIFECYCLE" in TERMINATED|INTERNAL_ERROR|SKIPPED) break;; esac
            sleep 20
          done
          [ "$RESULT" = "SUCCESS" ]
