# Stale CI schema sweep for databricks/demos/dbt.
#
# dbt-ci.yml drops its ephemeral schema in an `if: always()` teardown step, but
# CANCELLED runs (superseded pushes, concurrency cancellation) never execute
# teardown and leak their schema. This weekly sweep drops any leaked CI schemas
# older than 3 days via the `drop_stale_ci_schemas` run-operation.
#
# Runs on the same in-workspace Databricks App runner as dbt-ci.yml, with the
# same zero-GitHub-secrets auth. See dbt-ci.yml for the security model.
name: dbt CI schema sweep

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    # Never run for forks / other actors — this schedules onto an in-workspace runner.
    if: github.repository == 'randypitcherii/shareables' && github.actor == 'randypitcherii'
    runs-on: [self-hosted, databricks-app]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: databricks/demos/dbt
    env:
      DBT_DEPLOYMENT_ENVIRONMENT: ci_testing
      # the sweep itself never builds models; schema value is unused but required
      DBT_DEFAULT_SCHEMA: dbt_rpw_dbt_databricks_reference_sweep
      DBT_DEFAULT_CATALOG: ${{ vars.DBT_DEFAULT_CATALOG || 'fe_randy_pitcher_workspace_catalog' }}
      DBT_WAREHOUSE_NAME: ${{ vars.DBT_WAREHOUSE_NAME || 'dbt_wh' }}
      DATABRICKS_CLI_VERSION: "1.3.0"

    steps:
      - uses: actions/checkout@v4

      - name: Adopt app service principal credentials for dbt
        run: |
          : "${DATABRICKS_HOST:?not running on the Databricks App runner}"
          : "${DATABRICKS_CLIENT_ID:?app SP client id missing from container env}"
          : "${DATABRICKS_CLIENT_SECRET:?app SP client secret missing from container env}"
          echo "::add-mask::$DATABRICKS_CLIENT_SECRET"
          echo "DBT_HOST=${DATABRICKS_HOST#https://}" >> "$GITHUB_ENV"
          echo "DBT_CLIENT_ID=$DATABRICKS_CLIENT_ID" >> "$GITHUB_ENV"
          echo "DBT_ENV_SECRET_DATABRICKS_CLIENT_SECRET=$DATABRICKS_CLIENT_SECRET" >> "$GITHUB_ENV"

      - name: Install Databricks CLI (user-space, cached)
        run: |
          CLI_DIR="$HOME/.dbx-cli/$DATABRICKS_CLI_VERSION"
          if [ ! -x "$CLI_DIR/databricks" ]; then
            mkdir -p "$CLI_DIR"
            curl -fsSL -o "$CLI_DIR/cli.tar.gz" \
              "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.tar.gz"
            tar -xzf "$CLI_DIR/cli.tar.gz" -C "$CLI_DIR"
            rm -f "$CLI_DIR/cli.tar.gz"
          fi
          echo "$CLI_DIR" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | sh; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.local/bin:$PATH"; }
          uv sync
          uv run dbt deps --profiles-dir .

      - name: Resolve SQL warehouse http_path
        run: |
          DBT_HTTP_PATH=$(databricks warehouses list -o json | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          warehouses = data.get("warehouses", data) if isinstance(data, dict) else data
          name = os.environ["DBT_WAREHOUSE_NAME"]
          matches = [w["id"] for w in warehouses if w.get("name") == name]
          if not matches:
              sys.exit(f"no SQL warehouse named {name!r} visible to the CI service principal")
          print(f"/sql/1.0/warehouses/{matches[0]}")
          ')
          echo "DBT_HTTP_PATH=$DBT_HTTP_PATH" >> "$GITHUB_ENV"

      - name: Drop stale CI schemas (older than 3 days)
        run: |
          uv run dbt run-operation drop_stale_ci_schemas \
            --args '{prefix: dbt_rpw_dbt_databricks_reference_pr, older_than_days: 3, dry_run: false}' \
            --target ci --profiles-dir .
