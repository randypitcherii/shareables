# dbt CD — continuous deployment for databricks/demos/dbt.
#
# Fires on merge to the production branch ONLY when the dbt project directory
# changed. Same trigger-and-poll shape as dbt-ci.yml: this workflow's only job
# is two API calls (run-now + poll) against the `dbt CD` Databricks job, which
# does the real work as its run_as service principal:
#   1. `databricks bundle deploy -t prod` at the merged SHA -- the DAB
#      components (jobs, schema, volume, docs app) redeploy themselves, and
#      only when a merge touched this directory, which is exactly the
#      "deploy on change" gate;
#   2. slim production build (`dbt build -s state:modified+ --fail-fast`)
#      against captured prod state, then a state refresh.
#
# Merged main code is trusted (fork PRs can't push here), and even so nothing
# executes on the runner -- the job downloads the tarball at the merged SHA.
# The trigger SP still holds nothing but CAN_MANAGE_RUN on the CI + CD jobs.
name: dbt CD

on:
  push:
    branches: [main]
    paths:
      - "databricks/demos/dbt/**"
      - ".github/workflows/dbt-cd.yml"
  workflow_dispatch:

permissions: {}

# never run two deploys at once; never skip the newest merge
concurrency:
  group: dbt-cd
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'randypitcherii/shareables' && github.actor == 'randypitcherii'
    runs-on: [self-hosted, databricks-app]
    timeout-minutes: 60
    env:
      DBT_CD_JOB_NAME: dbt CD
      GIT_REF: ${{ github.sha }}
      DATABRICKS_CLI_VERSION: "1.3.0"

    steps:
      # No checkout: nothing executes on this runner. The app container injects
      # DATABRICKS_HOST / DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET,
      # which the CLI picks up natively.
      - name: Install Databricks CLI (user-space, cached)
        run: |
          : "${DATABRICKS_HOST:?not running on the Databricks App runner}"
          CLI_DIR="$HOME/.dbx-cli/$DATABRICKS_CLI_VERSION"
          if [ ! -x "$CLI_DIR/databricks" ]; then
            mkdir -p "$CLI_DIR"
            curl -fsSL -o "$CLI_DIR/cli.tar.gz" \
              "https://github.com/databricks/cli/releases/download/v${DATABRICKS_CLI_VERSION}/databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.tar.gz"
            tar -xzf "$CLI_DIR/cli.tar.gz" -C "$CLI_DIR"
            rm -f "$CLI_DIR/cli.tar.gz"
          fi
          echo "$CLI_DIR" >> "$GITHUB_PATH"

      - name: Trigger dbt CD job and wait
        run: |
          JOB_ID=$(databricks jobs list -o json --name "$DBT_CD_JOB_NAME" | python3 -c '
          import json, os, sys
          jobs = json.load(sys.stdin)
          name = os.environ["DBT_CD_JOB_NAME"]
          matches = [j["job_id"] for j in jobs if j["settings"]["name"] == name]
          if not matches:
              sys.exit(f"no job named {name!r} visible to the trigger service principal")
          print(matches[0])
          ')
          echo "Triggering job $JOB_ID: git_ref=$GIT_REF"
          RUN_ID=$(databricks api post /api/2.2/jobs/run-now --json "{
            \"job_id\": $JOB_ID,
            \"job_parameters\": {\"git_ref\": \"$GIT_REF\"}
          }" | python3 -c 'import json, sys; print(json.load(sys.stdin)["run_id"])')

          # NB: keep this python free of escaped double quotes -- \" inside a
          # single-quoted python3 -c string is a SyntaxError that leaves the
          # loop spinning blind.
          STATUS_PY='
          import json, sys
          run = json.load(sys.stdin)
          state = run.get("status") or run.get("state") or {}
          term = state.get("termination_details") or {}
          print(state.get("state") or state.get("life_cycle_state") or "")
          print(term.get("code") or state.get("result_state") or "")
          print(run.get("run_page_url") or "")
          '
          while true; do
            OUT=$(databricks api get "/api/2.2/jobs/runs/get?run_id=$RUN_ID" | python3 -c "$STATUS_PY")
            LIFECYCLE=$(echo "$OUT" | sed -n 1p)
            RESULT=$(echo "$OUT" | sed -n 2p)
            RUN_URL=$(echo "$OUT" | sed -n 3p)
            if [ -z "${URL_PRINTED:-}" ] && [ -n "$RUN_URL" ]; then
              echo "Databricks run (deploy + build logs live here): $RUN_URL"
              URL_PRINTED=1
            fi
            echo "run $RUN_ID: ${LIFECYCLE:-unknown}"
            case "$LIFECYCLE" in TERMINATED|INTERNAL_ERROR|SKIPPED) break;; esac
            sleep 20
          done

          echo "final: $LIFECYCLE / $RESULT"
          echo "logs: $RUN_URL"
          [ "$RESULT" = "SUCCESS" ]
