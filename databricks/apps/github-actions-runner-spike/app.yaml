command:
  - bash
  - -lc
  - >
    uv sync --frozen &&
    uv run uvicorn app:app
    --host 0.0.0.0
    --port ${DATABRICKS_APP_PORT:-8000}
    --workers ${UVICORN_WORKERS:-2}
    --timeout-keep-alive ${UVICORN_TIMEOUT_KEEP_ALIVE:-5}
    --timeout-graceful-shutdown ${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-10}
    --limit-concurrency ${UVICORN_LIMIT_CONCURRENCY:-16}
    --limit-max-requests ${UVICORN_LIMIT_MAX_REQUESTS:-2000}

env:
  - name: DATABRICKS_OBO_ENABLED
    value: "true"
  # Single worker ON PURPOSE: the startup hook auto-starts the runner supervisor
  # when GH_RUNNER_PAT is present, and multiple workers would race to spawn it.
  - name: UVICORN_WORKERS
    value: "1"
  - name: SESSION_STATE_DB_PATH
    value: "/tmp/gha_runner_spike_session_state.sqlite3"
  # Fine-grained PAT (repo administration:write) from a Databricks secret app
  # resource (see databricks.yml). Lets the supervisor mint its own registration
  # tokens: app restarts self-heal with zero manual steps.
  - name: GH_RUNNER_PAT
    valueFrom: gh-runner-pat
