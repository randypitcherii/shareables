version: 2

models:
  - name: int_s3_inventory__objects
    description: >
      Latest inventory snapshot per bucket, one row per object version, enriched with
      version state, prefix, object kind, age, noncurrent duration, and priced monthly
      storage cost. Ages are measured from the snapshot date (`as_of_date`).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            # version_id is NULL for current-version-only reports -> coalesce in the key
            combination_of_columns: [bucket, key, "coalesce(version_id, '<none>')"]
    columns:
      - name: ingested_at
        description: "When this inventory row landed in the lakehouse (from the raw inventory table)."
      - name: version_state
        description: "current | noncurrent | delete_marker"
        data_tests:
          - accepted_values:
              arguments:
                values: ['current', 'noncurrent', 'delete_marker']
      - name: noncurrent_days
        description: "Days since the next-newer version of the key was written (how S3 lifecycle NoncurrentDays counts). NULL unless noncurrent."
      - name: is_expired_delete_marker
        description: "Delete marker that is the ONLY version left for its key -- it protects nothing."
      - name: object_kind
        description: "delta_log | data_file | other"
      - name: pricing_tier
        description: "Join key into s3_storage_class_pricing."
        data_tests:
          # an unpriced storage class silently zeroes cost: make it loud
          - relationships:
              arguments:
                to: ref('s3_storage_class_pricing')
                field: pricing_tier
              config:
                where: "not is_delete_marker"
      - name: billable_bytes
        description: "Size billed: max(size, the class's minimum billable object size); 0 for delete markers."
      - name: monthly_cost_usd
        description: "Storage list price per month (USD) for this version, from s3_storage_class_pricing."

  - name: int_s3_inventory__table_paths
    description: >
      Every S3 table root in an inventoried bucket: Unity Catalog storage paths plus
      unregistered Delta tables inferred from `_delta_log/` prefixes, with last
      read / write from table lineage and an active / inactive status.
    columns:
      - name: table_uri
        description: "Normalized s3:// table root."
        data_tests:
          - not_null
          - unique
      - name: path_source
        description: "unity_catalog | inferred_delta_log"
        data_tests:
          - accepted_values:
              arguments:
                values: ['unity_catalog', 'inferred_delta_log']
      - name: registered_table_count
        description: "How many UC tables point at this exact location (0 for inferred roots). Above 1 means duplicate registrations."
      - name: activity_status
        description: "active when read or written within s3_inventory_active_days of the bucket's snapshot date, else inactive."
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'inactive']

  - name: int_s3_inventory__objects_classified
    description: >
      int_s3_inventory__objects attributed to the innermost owning table root and
      assigned at most one savings opportunity (priority-ordered, so savings never
      double count), with an estimated monthly saving.
    columns:
      - name: path_source
        description: "unity_catalog | inferred_delta_log | untracked"
        data_tests:
          - accepted_values:
              arguments:
                values: ['unity_catalog', 'inferred_delta_log', 'untracked']
      - name: opportunity
        description: "The single savings opportunity this version counts toward, or NULL."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - expire_noncurrent_versions
                  - remove_expired_delete_markers
                  - vacuum_unreferenced_files
                  - archive_or_drop_inactive_tables
                  - review_unregistered_data
                  - fix_small_objects_in_min_size_classes
                  - tier_cold_standard_data
      - name: delta_file_status
        description: "From int_s3_inventory__delta_file_status for objects under a Delta root; 'n/a' otherwise."
        data_tests:
          - accepted_values:
              arguments:
                values: [active, delta_metadata, retained, vacuum_eligible, unreferenced, not_checked, n/a]
      - name: estimated_monthly_savings_usd
        description: "Estimated monthly storage saving (USD, list price) if the opportunity is acted on."

  - name: int_s3_inventory__delta_snapshot_files
    description: >
      PYTHON, real-inventory mode only (sample mode uses the seed
      s3_inventory_sample__delta_snapshot_files). The one thing SQL can't do: per
      Delta table root, the data files its snapshot references at the inventory
      snapshot time (`current`) and just before each in-window commit that
      removed files (`window`), read from the transaction log only via
      inputFiles(). All joins and classification happen in SQL downstream.
    columns:
      - name: snapshot_kind
        description: "current (as of the inventory snapshot) | window (the snapshot before a commit, inside the retention window, that removed files)."
      - name: window_ambiguous_removed_files
        description: "Files removed by the FIRST in-window commit. Databricks blocks reading the version before it, so they can't be named; > 0 (or -1 = unknown) makes leftovers 'unreferenced' instead of 'vacuum_eligible'."
      - name: file_uri
        description: "A data file the snapshot references. NULL on the placeholder row of a table with no files or a failed listing."
      - name: list_status
        description: "ok | ok: current is latest (inventory older than the readable window) | window_truncated | error: <error> (table unreadable)."

  - name: int_s3_inventory__delta_file_status
    description: >
      Should this file be here? Every current object under a Delta table root,
      checked against the table logs: active | delta_metadata | retained |
      vacuum_eligible | unreferenced | not_checked. "Active" means referenced by ANY
      table's current snapshot, so shallow clones keep their source's files alive.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [bucket, key, "coalesce(version_id, '<none>')"]
    columns:
      - name: delta_file_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [active, delta_metadata, retained, vacuum_eligible, unreferenced, not_checked]
      - name: is_kept_alive_by_other_table
        description: "Active only because another table (typically a shallow clone) references it."
      - name: horizon_at
        description: "When the file lists were taken, minus the table's delta.deletedFileRetentionDuration: files removed before it are fair game for VACUUM."
