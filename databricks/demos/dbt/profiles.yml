# ===========================================================================
# This profiles.yml is INTENTIONALLY committed to version control.
#
#   * The `dev` target uses interactive SSO (OAuth U2M). It stores NO secret, so
#     it is safe to commit. A first-time contributor just runs `dbt build` and a
#     browser opens for login -- no `dbt init`, no copying a template.
#   * The `ci` / `prod` targets read EVERY value from environment variables.
#     They run inside serverless Databricks job tasks as the job's `run_as`
#     service principal: the task wrapper (scripts/databricks_dbt_runner.py)
#     resolves a short-lived token from the task's AMBIENT credentials at
#     runtime. No OAuth client secret is ever provisioned or stored anywhere --
#     assigning run_as IS the entire auth setup.
#
# WHAT GETS A PUBLIC FALLBACK -- and what does NOT:
#   * `catalog` / `schema` HAVE in-repo dev fallbacks, so schema routing works with
#     zero config (see macros/config/generate_schema_name.sql).
#   * `host` and `http_path` have NO fallback ON PURPOSE. They are workspace-specific
#     (no value is universally correct) and they are internal infrastructure
#     identifiers we don't publish. You MUST provide them via env vars (copy
#     template.env -> .env and fill them in).
#   * The runtime token uses the `DBT_ENV_SECRET_` prefix: dbt masks these in
#     logs and forbids them outside profiles.yml, so the token can never leak into
#     compiled SQL or the warehouse.
# ===========================================================================
rpw_dbt_databricks_reference:
  target: dev
  outputs:

    # ---- development: SSO browser login, no stored secret -------------------
    dev:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"             # REQUIRED, no fallback (workspace-specific)
      http_path: "{{ env_var('DBT_HTTP_PATH') }}"   # REQUIRED, no fallback (workspace-specific)
      catalog: "{{ env_var('DBT_DEFAULT_CATALOG', 'analytics_dev') }}"
      schema: "{{ env_var('DBT_DEFAULT_SCHEMA', 'dbt') }}"
      auth_type: oauth          # U2M: opens a browser for SSO; nothing stored in the repo
      threads: 8

    # ---- ci: runtime token of the CI job's run_as service principal ---------
    ci:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"
      http_path: "{{ env_var('DBT_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_DEFAULT_CATALOG') }}"
      schema: "{{ env_var('DBT_DEFAULT_SCHEMA') }}"
      token: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_TOKEN') }}"
      threads: 8

    # ---- prod: runtime token of the prod job's run_as service principal -----
    prod:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"
      http_path: "{{ env_var('DBT_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_DEFAULT_CATALOG') }}"
      schema: "{{ env_var('DBT_DEFAULT_SCHEMA') }}"
      token: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_TOKEN') }}"
      threads: 16
