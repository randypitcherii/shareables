name: 'rpw_dbt_databricks_reference'
version: '1.0.0'

profile: 'rpw_dbt_databricks_reference'

# copied into target/ by `dbt docs generate`, so doc blocks can show diagrams
# with ![...](docs/diagrams/<file>.png)
asset-paths: ["docs/diagrams"]

# ---------------------------------------------------------------------------
# Environment-driven configuration (the portable-onboarding pattern)
#
# Each value reads an environment variable when set, else falls back to a public
# dev default that lives in source control. The trade-off: dev fallbacks are
# visible to anyone reading the repo -- in exchange, a brand-new contributor can
# clone and `dbt build` with ZERO configuration (no `dbt init`, no secrets) and
# land safely in their own isolated dev schema.
#
# Non-dev deployments (CI / prod) inject the real values via environment variables;
# nothing sensitive is ever committed. See macros/config/generate_schema_name.sql
# for how `deployment_environment` routes schemas.
# ---------------------------------------------------------------------------
vars:
  # one of: development | ci_testing | production
  deployment_environment: "{{ env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development') }}"
  default_catalog: "{{ env_var('DBT_DEFAULT_CATALOG', 'rpw_dev') }}"
  default_schema: "{{ env_var('DBT_DEFAULT_SCHEMA', 'dbt') }}"
  # full-refresh history window for system.billing.usage; incremental runs scan only
  # recent data regardless. Keep small for quick demo builds, raise for real backfills.
  usage_history_days: "{{ env_var('DBT_USAGE_HISTORY_DAYS', 90) }}"

  # ---- models/patterns: migration pattern examples (synthetic data only) ----
  # size of the synthetic audience every pattern example builds from
  pattern_member_count: "{{ env_var('DBT_PATTERN_MEMBER_COUNT', 5000) }}"
  # compile-time value list for the one_hot() dynamic-SQL example
  pattern_device_types: [ctv, mobile, desktop, tablet]
  # seed-validation circuit breaker: fail the build above this invalid share
  pattern_max_invalid_share: 0.25

  # ---- models/ai_ml_inference: batch inference from a UC-logged MLflow model ----
  # The model to apply. Any MLflow model logged in Unity Catalog works. The
  # default is a small embedding model that Databricks already provides in every
  # workspace, so the demo needs no training and no registration. Version 2, not
  # 3: v3's logged requirements pin transformers==4.44.0.dev0, which is not on
  # PyPI, so Model Serving cannot build a container for it.
  ai_ml_inference_model_name: "{{ env_var('DBT_AI_ML_INFERENCE_MODEL_NAME', 'system.ai.bge_small_en_v1_5') }}"
  ai_ml_inference_model_version: "{{ env_var('DBT_AI_ML_INFERENCE_MODEL_VERSION', '2') }}"
  ai_ml_inference_row_count: "{{ env_var('DBT_AI_ML_INFERENCE_ROW_COUNT', 1000) }}"
  # The Model Serving endpoint for the ai_query() path. Empty = that path is
  # DISABLED, so a clean clone builds green. `make ai-ml-inference-endpoint`
  # creates it and prints the value to set.
  ai_ml_inference_serving_endpoint: "{{ env_var('DBT_AI_ML_INFERENCE_SERVING_ENDPOINT', '') }}"

  # ---- models/ai_gateway_improvement: the AI Gateway improvement loop ----
  # See models/ai_gateway_improvement/README.md. Defaults are production-sized;
  # CI shrinks the history and the scoring cap (see the models' configs).
  # days of system.ai_gateway.usage the streaming mirror loads on first build
  ai_gateway_history_days: "{{ env_var('DBT_AI_GATEWAY_HISTORY_DAYS', 30) }}"
  # idle gap that closes a synthetic session (no client session id)
  ai_gateway_session_gap_minutes: 30
  # max sessions scored by ai_decide per run (top by cost + a random sample).
  # Measured on an X-Small serverless warehouse: ~2-3 question-evaluations/s,
  # so a session costs ~2 s (metadata rubric, 5 questions) to ~6 s (plus the
  # content rubric, 11 more). 100/run fits an hourly job with room to spare
  # (2,400 sessions/day, costliest first). Raise it after measuring yours.
  ai_gateway_max_sessions_per_run: "{{ env_var('DBT_AI_GATEWAY_MAX_SESSIONS_PER_RUN', 100) }}"
  # share of each run's cap reserved for a uniform random sample
  ai_gateway_random_sample_share: 0.1
  # share of each run's cap spent re-scoring already-scored sessions (stability probe)
  ai_gateway_stability_probe_share: 0.02
  # answers below this confidence aggregate as `unclear`
  ai_gateway_min_confidence: 0.6
  # bounded transcript size passed to ai_decide
  ai_gateway_max_state_chars: 12000
  # request_tags / service_tags keys that name the owning team, in priority order
  ai_gateway_team_tag_keys: [team, cost_center, project]

  # ---- S3 Inventory storage pipeline (models/*/s3_inventory, models/marts/storage) ----
  # Point the pipeline at a real S3 Inventory table by setting DBT_S3_INVENTORY_TABLE
  # (plus _CATALOG / _SCHEMA, see models/staging/s3_inventory/_s3_inventory__sources.yml).
  # Left unset, the whole pipeline builds from the committed sample seeds in
  # seeds/s3_inventory/ -- zero config, deterministic, and what CI tests against.
  s3_inventory_table: "{{ env_var('DBT_S3_INVENTORY_TABLE', '') }}"
  # CSV-format inventories URL-encode object keys; Parquet / ORC do not.
  s3_inventory_keys_url_encoded: "{{ env_var('DBT_S3_INVENTORY_KEYS_URL_ENCODED', 'false') }}"
  # a table with no read or write in this many days (as of the snapshot) is inactive
  s3_inventory_active_days: "{{ env_var('DBT_S3_INVENTORY_ACTIVE_DAYS', 90) }}"
  # S3 Standard objects at least this old are flagged as tiering candidates
  s3_inventory_cold_days: "{{ env_var('DBT_S3_INVENTORY_COLD_DAYS', 90) }}"
  # noncurrent versions older than this are flagged for lifecycle expiration
  s3_inventory_noncurrent_retention_days: "{{ env_var('DBT_S3_INVENTORY_NONCURRENT_RETENTION_DAYS', 30) }}"
  # pipeline health (s3_inventory_snapshot_health): a snapshot is unhealthy when it
  # landed more than this many hours after it was taken...
  s3_inventory_max_ingest_lag_hours: "{{ env_var('DBT_S3_INVENTORY_MAX_INGEST_LAG_HOURS', 24) }}"
  # ...arrived more than this many hours after the bucket's previous snapshot (daily
  # inventories + slack), or its bytes moved more than this share vs the previous one
  s3_inventory_max_snapshot_gap_hours: "{{ env_var('DBT_S3_INVENTORY_MAX_SNAPSHOT_GAP_HOURS', 36) }}"
  s3_inventory_max_volume_change: "{{ env_var('DBT_S3_INVENTORY_MAX_VOLUME_CHANGE', 0.5) }}"

flags:
  use_managed_iceberg: true

models:
  rpw_dbt_databricks_reference:
    # defaults for every model in the project
    +materialized: view
    +persist_docs:
      relation: true
      columns: true

    # ---- layer-specific configuration ----
    # `daily` is the production cadence tag: the DAB job runs `dbt build -s tag:daily`
    # on a daily schedule. Models without it (e.g. managed_iceberg_examples) are
    # intentionally outside the production DAG.
    staging:
      +tags: [staging, daily]
      +schema: staging
      +materialized: view
      # selector tag for the S3 Inventory storage pipeline: dbt build -s tag:s3_inventory
      s3_inventory:
        +tags: [s3_inventory]

    modeled:
      +tags: [modeled, daily]
      +schema: modeled
      +materialized: table
      +auto_liquid_cluster: true
      s3_inventory:
        +tags: [s3_inventory]

    marts:
      +tags: [mart, daily]
      +schema: mart
      +materialized: table
      +auto_liquid_cluster: true
      storage:
        +tags: [s3_inventory]
      # Grants-as-code: in production, consumers get read access to the marts as part
      # of every run -- no manual GRANTs. Empty list otherwise, which tells dbt to
      # actively revoke stray grants on dev/CI sandboxes. The condition checks the CLI
      # var (how the production job injects it) and falls back to the env var.
      +grants:
        select: "{{ ['account users'] if var('deployment_environment', env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development')) == 'production' else [] }}"

    managed_iceberg_examples:
      +materialized: table
      +table_format: iceberg
      +auto_liquid_cluster: false
      +tblproperties:
        'format-version': 3
      +schema: managed_iceberg_examples

    # Migration pattern examples on synthetic data: Python models, Python UDFs,
    # dynamic-SQL macros, and seed-based validation. Tagged
    # `patterns` and deliberately NOT `daily`, so the production schedule never
    # runs them. Build them with `make patterns`.
    patterns:
      +tags: [patterns]
      +schema: patterns
      +materialized: table
      # Demo examples are never deployed. The daily schedule selects tag:daily,
      # but CD builds EVERY modified node in production, so the folder itself
      # switches off there.
      +enabled: "{{ var('deployment_environment', env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development')) != 'production' }}"
      # Python models run as serverless job runs; no cluster to manage
      +submission_method: serverless_cluster

    # Batch inference from a UC-logged MLflow model, two ways (Python model +
    # ai_query against a serving endpoint). See models/ai_ml_inference/README.md.
    # Same production guard as patterns. Project vars are not in scope while
    # dbt_project.yml renders, so configs pass the env var as the var() fallback.
    ai_ml_inference:
      +tags: [ai_ml_inference]
      +schema: ai_ml_inference
      +materialized: table
      +enabled: "{{ var('deployment_environment', env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development')) != 'production' }}"
      +submission_method: serverless_cluster
      ai_ml_inference_embeddings_python:
        +meta:
          ai_ml_inference_model_uri: "models:/{{ var('ai_ml_inference_model_name', env_var('DBT_AI_ML_INFERENCE_MODEL_NAME', 'system.ai.bge_small_en_v1_5')) }}/{{ var('ai_ml_inference_model_version', env_var('DBT_AI_ML_INFERENCE_MODEL_VERSION', '2')) }}"
      ai_ml_inference_embeddings_serving:
        +enabled: "{{ var('deployment_environment', env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development')) != 'production' and var('ai_ml_inference_serving_endpoint', env_var('DBT_AI_ML_INFERENCE_SERVING_ENDPOINT', '')) != '' }}"

    # The AI Gateway improvement loop: system.ai_gateway.usage + inference
    # tables -> sessions -> ai_decide scores -> ranked recommendations.
    # Tagged `hourly`, so the dbt Hourly job builds it. Streaming table and
    # materialized views refresh incrementally on each build.
    ai_gateway_improvement:
      +tags: [ai_gateway_improvement, hourly]
      +schema: ai_gateway_improvement
      +materialized: table
      # Per-user, account-wide data: NOT granted to `account users`. Production
      # grants SELECT to the group named in DBT_AI_GATEWAY_READERS (if set). The
      # dashboard needs no grant: it runs with the owner's embedded credentials.
      +grants:
        select: "{{ [env_var('DBT_AI_GATEWAY_READERS', '')] if (var('deployment_environment', env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development')) == 'production' and env_var('DBT_AI_GATEWAY_READERS', '') != '') else [] }}"

    # The golden-set eval for the scoring rubrics. On demand only
    # (make ai-gateway-eval): no cadence tag, so no schedule ever runs it.
    ai_gateway_improvement_eval:
      +tags: [ai_gateway_eval]
      +schema: ai_gateway_improvement
      +materialized: table
      +enabled: "{{ var('deployment_environment', env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development')) != 'production' }}"

    # Unity Catalog metric views over the system catalog, ported from
    # HobbsAnalytics/databricks-metric-views-system-tables. Each model body IS the
    # metric-view YAML (dimensions + measures); dbt ships it via
    # `CREATE VIEW ... WITH METRICS LANGUAGE YAML`. They read system.* sources
    # directly ON PURPOSE -- upstream validated every join against the raw system
    # tables and each view is deliberately self-contained (inline SCD sources), so
    # routing them through staging views would change what was validated.
    metric_views:
      +tags: [metric_views, daily]
      +schema: metric_views
      +materialized: metric_view
      # Same grants-as-code posture as marts: metric views are a consumer surface
      # (Genie, AI/BI dashboards), so production grants read access on every run.
      +grants:
        select: "{{ ['account users'] if var('deployment_environment', env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development')) == 'production' else [] }}"
      # S3 storage + inventory pipeline health. Unlike the system-table views above
      # these read this project's own models (int_s3_inventory__*, storage marts),
      # and they back the S3 Storage dashboard (resources/s3_storage.dashboard.yml).
      storage:
        +tags: [s3_inventory]

seeds:
  rpw_dbt_databricks_reference:
    # S3 Inventory pipeline: S3 list prices (an assumption table -- edit for your
    # region / contract) plus the sample data the pipeline builds from when no real
    # inventory is configured. Column types are pinned in seeds/s3_inventory/_s3_inventory__seeds.yml.
    s3_inventory:
      +tags: [s3_inventory, daily]
    # The schema contract for every system.* column the metric views depend on.
    # tests/assert_system_source_*_match_contract.sql compare it against
    # system.information_schema to catch structure drift in the system catalog.
    # (tags are additive down the tree, so they sit on this seed alone rather
    # than on the whole project -- the patterns seeds must not inherit `daily`)
    system_table_schema_contract:
      +tags: [metric_views, daily]
      +column_types:
        table_schema: string
        table_name: string
        column_name: string
        data_type: string

    # price / tier map and the golden-set labels for the AI Gateway loop
    ai_gateway_improvement:
      +tags: [ai_gateway_improvement, hourly]
      +schema: ai_gateway_improvement
    # labelled sessions for the rubric eval; on demand only
    ai_gateway_improvement_eval:
      +tags: [ai_gateway_eval]
      +schema: ai_gateway_improvement
      +enabled: "{{ var('deployment_environment', env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development')) != 'production' }}"

    # reference data for the seed-validation pattern (models/patterns/)
    patterns:
      +tags: [patterns]
      +schema: patterns
      +enabled: "{{ var('deployment_environment', env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development')) != 'production' }}"

functions:
  rpw_dbt_databricks_reference:
    ai_gateway_improvement:
      +tags: [ai_gateway_improvement, hourly]
      +schema: ai_gateway_improvement
    patterns:
      +tags: [patterns]
      +schema: patterns
      +enabled: "{{ var('deployment_environment', env_var('DBT_DEPLOYMENT_ENVIRONMENT', 'development')) != 'production' }}"
