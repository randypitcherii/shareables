bundle:
  name: dbt_databricks_demo

include:
  - resources/*.yml

variables:
  production_catalog:
    description: Unity Catalog catalog used by production dbt runs.
    default: rpw_prod
  production_schema:
    description: Default schema for production dbt models without a layer-specific schema.
    default: dbt
  production_artifact_schema:
    description: Schema that owns the managed volume for production dbt artifacts.
    default: dbt_artifacts
  production_artifact_volume:
    description: Managed volume that stores production dbt state and generated docs.
    default: dbt_demo_artifacts
  warehouse_id:
    description: Serverless or Pro SQL warehouse ID used by the dbt workflow.
    lookup:
      warehouse: dbt_wh
  ci_trigger_principal:
    description: >-
      Application ID of the principal allowed to trigger the CI and CD jobs
      (the GitHub Actions runner app's auto-created service principal). It gets
      CAN_MANAGE_RUN on those two jobs and nothing else -- dbt itself runs as
      each job's run_as identity, so the trigger principal needs zero UC grants.
    default: ba28de80-7216-4294-9134-7e5ae7a85979
  deployed_at:
    description: >-
      Human-readable last-deploy date (YYYY-MM-DD) stamped as a tag on every
      resource. The Makefile passes it automatically; a bare `bundle deploy`
      leaves the honest default.
    default: unknown
  production_service_principal:
    description: >-
      Application ID of the service principal that owns and runs production (looked up
      by display name). Production must NOT run as the deploying human -- least
      privilege, and deploys survive people leaving. Override at deploy time if your
      SP has a different name: --var="production_service_principal=<application-id>".
    lookup:
      service_principal: dbt_prod_sp
  ci_catalog:
    description: >-
      Unity Catalog catalog that holds the disposable per-PR CI schemas. Owned by
      the CI service principal; nothing durable lives here.
    default: rpw_ci
  ci_service_principal:
    description: >-
      Application ID of the service principal CI runs as (looked up by display
      name). Deliberately NOT the production SP: it owns the CI catalog, but on
      the production catalog it holds only read grants (USE CATALOG, USE SCHEMA,
      SELECT, READ VOLUME -- enough for Slim CI deferral and the state-manifest
      download), so a CI run of unreviewed PR code cannot write to production.
    lookup:
      service_principal: dbt_ci_sp

targets:
  dev:
    default: true
    mode: development
    variables:
      production_catalog: analytics_dev
      production_schema: dbt_${workspace.current_user.short_name}
      production_artifact_schema: dbt_artifacts_${workspace.current_user.short_name}
      ci_catalog: analytics_dev
      # dev runs as the developer; short-circuit the SP lookups so dev deploys
      # don't require the service principals to exist.
      production_service_principal: unused-in-dev
      ci_service_principal: unused-in-dev
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    presets:
      # Standard tag set (see THE_ONE_TRUE_WAY #12): env + repo + owner +
      # bundle + human-readable last-deploy date on every resource.
      tags:
        env: dev
        repo: randypitcherii/shareables
        owner: ${workspace.current_user.userName}
        bundle: ${bundle.name}
        deployed_at: ${var.deployed_at}

  prod:
    mode: production
    # Production runs as a dedicated M2M service principal, never the deploying user,
    # and deploys to a shared path so it isn't coupled to anyone's home directory.
    # run_as lives on the JOB (not the target) because bundles containing apps reject
    # a target-level run_as that differs from the deployer -- apps always run as
    # their own auto-created service principal.
    #
    # The production SP holds CAN_MANAGE on every bundle resource because the
    # dbt CD job redeploys this bundle AS that SP on merge (self-deployment):
    # it must be able to update the very jobs it is defined in.
    permissions:
      - service_principal_name: ${var.production_service_principal}
        level: CAN_MANAGE
      # keep the human deployer explicitly on the ACL too, so manual deploys
      # and SP-driven CD deploys never strip each other's access
      - user_name: randy.pitcher@databricks.com
        level: CAN_MANAGE
      # The CI SP gets CAN_VIEW only: enough to read the deployed bundle files
      # its job task executes (permissions apply to the workspace folder too),
      # never enough to edit jobs or trigger anything.
      - service_principal_name: ${var.ci_service_principal}
        level: CAN_VIEW
    resources:
      jobs:
        # CD/daily/hourly run as the production SP: run_as is the ONLY auth
        # config they need -- each task resolves a runtime token from ambient
        # credentials.
        dbt_production_daily:
          run_as:
            service_principal_name: ${var.production_service_principal}
        dbt_cd:
          run_as:
            service_principal_name: ${var.production_service_principal}
        dbt_hourly:
          run_as:
            service_principal_name: ${var.production_service_principal}
        # CI runs as its OWN SP, never production's: it owns the CI catalog it
        # builds into, and production is read-only to it -- unreviewed PR code
        # cannot write to production even if it tries.
        dbt_ci:
          run_as:
            service_principal_name: ${var.ci_service_principal}
    workspace:
      # Deploy under the production SP's own user folder: not coupled to any human's
      # home directory, and (unlike /Workspace/Shared) not writable by all users.
      root_path: /Workspace/Users/${var.production_service_principal}/.bundle/${bundle.name}/${bundle.target}
    presets:
      # Standard tag set (see THE_ONE_TRUE_WAY #12).
      tags:
        env: prod
        repo: randypitcherii/shareables
        owner: dbt_prod_sp
        bundle: ${bundle.name}
        deployed_at: ${var.deployed_at}
