<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="404" viewBox="0 0 1250 404" font-family="Menlo, ui-monospace, monospace">
  <defs>
    <marker id="tipO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF8B00"/>
    </marker>
    <marker id="tipP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6554C0"/>
    </marker>
    <marker id="tipG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#36B37E"/>
    </marker>
  </defs>

  <rect width="1250" height="404" fill="#FFFFFF"/>

  <!-- ── column headers ────────────────────────────────────────────────── -->
  <text x="56" y="26" font-size="10" font-weight="700" fill="#555555" letter-spacing="0.1em">IN GIT</text>
  <text x="832" y="26" font-size="10" font-weight="700" fill="#555555" letter-spacing="0.1em" text-anchor="middle">RUNS AS</text>
  <text x="1085" y="26" font-size="10" font-weight="700" fill="#555555" letter-spacing="0.1em" text-anchor="middle">LANDS IN</text>

  <!-- ══ COLUMN 3 — the catalogs ══════════════════════════════════════════
       Grammar: thin black box = a catalog, colored card inside = a schema. -->

  <!-- analytics_dev -->
  <rect x="940" y="53" width="290" height="86" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="1085" y="72" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">analytics_dev</text>
  <rect x="956" y="80" width="258" height="48" fill="#FFFFFF" stroke="#FF8B00" stroke-width="2"/>
  <text x="1085" y="100" font-size="11" font-weight="700" fill="#FF8B00" text-anchor="middle">dbt_art_vandelay</text>
  <text x="1085" y="117" font-size="9.5" fill="#555555" text-anchor="middle">one sandbox schema per developer</text>

  <!-- analytics_ci -->
  <rect x="940" y="165" width="290" height="86" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="1085" y="184" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">analytics_ci</text>
  <rect x="956" y="192" width="258" height="48" fill="#FFFFFF" stroke="#6554C0" stroke-width="2"/>
  <text x="1085" y="212" font-size="11" font-weight="700" fill="#6554C0" text-anchor="middle">dbt_pr7_build3</text>
  <text x="1085" y="229" font-size="9.5" fill="#555555" text-anchor="middle">ephemeral — dropped when green</text>

  <!-- analytics_prod — four real schemas, everyone else reads these -->
  <rect x="940" y="266" width="290" height="122" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="1085" y="285" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">analytics_prod</text>
  <rect x="956" y="294" width="125" height="30" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <text x="1018.5" y="313" font-size="10" font-weight="700" fill="#36B37E" text-anchor="middle">staging</text>
  <rect x="1089" y="294" width="125" height="30" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <text x="1151.5" y="313" font-size="10" font-weight="700" fill="#36B37E" text-anchor="middle">modeled</text>
  <rect x="956" y="332" width="125" height="30" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <text x="1018.5" y="351" font-size="10" font-weight="700" fill="#36B37E" text-anchor="middle">marts</text>
  <rect x="1089" y="332" width="125" height="30" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <text x="1151.5" y="351" font-size="10" font-weight="700" fill="#36B37E" text-anchor="middle">metrics</text>
  <text x="1085" y="379" font-size="9.5" fill="#555555" text-anchor="middle">the schemas everyone else reads</text>

  <!-- ══ COLUMN 2 — the principals ═══════════════════════════════════════ -->

  <!-- the developer -->
  <rect x="762" y="68" width="140" height="56" fill="#FFFFFF" stroke="#FF8B00" stroke-width="2"/>
  <text x="832" y="92" font-size="11" font-weight="700" fill="#FF8B00" text-anchor="middle">art_vandelay</text>
  <text x="832" y="109" font-size="9.5" fill="#555555" text-anchor="middle">a human, via SSO</text>

  <!-- the CI service principal -->
  <rect x="762" y="180" width="140" height="56" fill="#FFFFFF" stroke="#6554C0" stroke-width="2"/>
  <text x="832" y="204" font-size="11" font-weight="700" fill="#6554C0" text-anchor="middle">dbt_ci_sp</text>
  <text x="832" y="221" font-size="9.5" fill="#555555" text-anchor="middle">service principal</text>

  <!-- the prod service principal -->
  <rect x="762" y="292" width="140" height="56" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <text x="832" y="316" font-size="11" font-weight="700" fill="#36B37E" text-anchor="middle">dbt_prod_sp</text>
  <text x="832" y="333" font-size="9.5" fill="#555555" text-anchor="middle">service principal</text>

  <!-- ══ COLUMN 1 — the git graph ════════════════════════════════════════ -->

  <!-- production branch -->
  <path d="M 58 320 H 700" stroke="#36B37E" stroke-width="2.5" fill="none"/>
  <text x="60" y="307" font-size="12" font-weight="700" fill="#36B37E">production</text>

  <!-- feature branch, cut from the release commit -->
  <path d="M 170 320 C 240 320 262 96 332 96 H 510" stroke="#FF8B00" stroke-width="2.5" fill="none"/>
  <text x="334" y="78" font-size="12" font-weight="700" fill="#FF8B00">feature/123-my-feature</text>

  <!-- branch head into the pull request -->
  <path d="M 516 103 C 550 148 552 208 583 208" stroke="#6554C0" stroke-width="2.5" fill="none"/>
  <!-- pull request back down into the release commit -->
  <path d="M 640 232 C 640 278 662 320 690 320" stroke="#6554C0" stroke-width="2.5" fill="none"/>

  <!-- the pull request -->
  <rect x="585" y="184" width="110" height="48" fill="#6554C0"/>
  <text x="640" y="204" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pull Request</text>
  <text x="640" y="221" font-size="9" fill="#DDD8F5" text-anchor="middle">release gate</text>
  <path d="M 687 174 L 694 182 L 706 166" fill="none" stroke="#36B37E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- commits, filled and drawn last so no line ever shows through them -->
  <circle cx="170" cy="320" r="8" fill="#36B37E"/>
  <circle cx="700" cy="320" r="8" fill="#36B37E"/>
  <g fill="#FF8B00">
    <circle cx="350" cy="96" r="6.5"/>
    <circle cx="403" cy="96" r="6.5"/>
    <circle cx="456" cy="96" r="6.5"/>
    <circle cx="510" cy="96" r="6.5"/>
  </g>
  <text x="170" y="344" font-size="10" fill="#555555" text-anchor="middle">release 1.0.0</text>
  <text x="700" y="344" font-size="10" fill="#555555" text-anchor="middle">release 1.0.1</text>

  <!-- ══ git → principal → catalog ═══════════════════════════════════════ -->

  <!-- dev -->
  <path d="M 520 96 H 756" stroke="#FF8B00" stroke-width="1.5" fill="none" marker-end="url(#tipO)"/>
  <path d="M 906 96 H 950" stroke="#FF8B00" stroke-width="1.5" fill="none" marker-end="url(#tipO)"/>

  <!-- ci -->
  <path d="M 699 208 H 756" stroke="#6554C0" stroke-width="1.5" fill="none" marker-end="url(#tipP)"/>
  <path d="M 906 208 H 950" stroke="#6554C0" stroke-width="1.5" fill="none" marker-end="url(#tipP)"/>

  <!-- prod -->
  <path d="M 712 320 H 756" stroke="#36B37E" stroke-width="1.5" fill="none" marker-end="url(#tipG)"/>
  <path d="M 906 320 H 950" stroke="#36B37E" stroke-width="1.5" fill="none" marker-end="url(#tipG)"/>
</svg>
