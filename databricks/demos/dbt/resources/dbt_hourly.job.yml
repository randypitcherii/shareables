# Hourly cadence job. Exists BEFORE any hourly model does, on purpose
# (THE_ONE_TRUE_WAY #15): jobs select by frequency tag, so the first model that
# adds `+tags: [hourly]` starts building here with ZERO job-definition changes
# -- the job surface is static, the repo's contents decide what runs.
#
# The first tag:hourly models are the AI Gateway improvement loop
# (models/ai_gateway_improvement/), so the schedule is now UNPAUSED. dev and
# test deploys stay paused anyway: bundle development mode pauses schedules.
resources:
  jobs:
    dbt_hourly:
      name: dbt Hourly
      description: Builds the hourly-tagged models (the AI Gateway improvement loop).
      permissions:
        - group_name: users
          level: CAN_VIEW
        - service_principal_name: ${resources.apps.dbt_docs.service_principal_client_id}
          level: CAN_VIEW
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: dbt_build_hourly
          spark_python_task:
            python_file: ../scripts/databricks_dbt_runner.py
            parameters:
              - "--mode=prod-build"
              - "--build-select=tag:hourly"
              # no --artifacts-volume: only dbt Daily and dbt CD capture state
              - "--project-dir=${workspace.file_path}"
              - "--warehouse-id=${var.warehouse_id}"
              - "--catalog=${var.production_catalog}"
              - "--schema=${var.production_schema}"
          environment_key: dbt_via_uv
          # ai_decide scoring is the long pole (~2-6 s per session on a small
          # warehouse); ai_gateway_max_sessions_per_run (100) keeps it well
          # inside the hour.
          timeout_seconds: 3000
      environments:
        - environment_key: dbt_via_uv
          spec:
            environment_version: "3"
            # no dbt here on purpose -- `uv sync` installs the pyproject-pinned
            # version inside the task
            dependencies:
              - uv
              - databricks-sdk
