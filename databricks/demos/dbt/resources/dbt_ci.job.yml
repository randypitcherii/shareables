# CI job for the dbt project: DEFINED here, UNSCHEDULED, triggered per-PR by
# GitHub Actions with job parameters. GitHub is only the gate + trigger; dbt
# executes HERE, on serverless compute, so every CI log lives in the Jobs UI
# next to production's.
#
# Auth: the job's run_as service principal (set in the prod target of
# databricks.yml) IS the auth -- the task wrapper resolves a runtime token from
# its ambient credentials. No OAuth client secret exists anywhere.
#
# The task downloads the repo tarball at `git_ref` (the PR head SHA), so PR
# code executes here under the run_as SP -- never inside the GitHub runner's
# container. Teardown of the disposable schema happens in-task (try/finally),
# so even a cancelled GitHub workflow can't leak a schema; only cancelling the
# Databricks run itself can, which the weekly `ci-sweep` mode mops up.
resources:
  jobs:
    dbt_ci:
      name: rpw-dbt-databricks-reference CI
      description: >-
        Per-PR dbt build into a disposable schema (Slim CI against prod state,
        --fail-fast, in-task teardown). Triggered by GitHub Actions with job
        parameters; never scheduled -- except the weekly ci-sweep trigger that
        drops leaked CI schemas.
      max_concurrent_runs: 5
      permissions:
        - group_name: users
          level: CAN_VIEW
        # The GitHub Actions runner app's SP may ONLY trigger runs of this job.
        # It needs no UC grants at all: dbt runs as this job's run_as identity.
        - service_principal_name: ${var.ci_trigger_principal}
          level: CAN_MANAGE_RUN
      parameters:
        - name: git_ref
          default: main
        - name: ci_schema
          default: dbt_rpw_dbt_databricks_reference_pr0_build0
        - name: mode
          default: ci-build
      tasks:
        - task_key: dbt_ci
          spark_python_task:
            python_file: ../scripts/databricks_dbt_runner.py
            parameters:
              - "--mode={{job.parameters.mode}}"
              - "--git-ref={{job.parameters.git_ref}}"
              - "--schema={{job.parameters.ci_schema}}"
              - "--warehouse-id=${var.warehouse_id}"
              - "--catalog=${var.production_catalog}"
              - "--artifacts-volume=/Volumes/${var.production_catalog}/${var.production_artifact_schema}/${var.production_artifact_volume}"
              - "--usage-history-days=7"
          environment_key: dbt_via_uv
          timeout_seconds: 2400
      environments:
        - environment_key: dbt_via_uv
          spec:
            environment_version: "3"
            # dbt itself is NOT installed here on purpose: the wrapper runs
            # `uv sync`, so pyproject.toml pins the dbt version for CI and prod
            # alike -- upgrading dbt is a one-line PR, never a job edit.
            dependencies:
              - uv
              - databricks-sdk
