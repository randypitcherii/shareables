# Continuous deployment job: runs on merge to the production branch (triggered
# by .github/workflows/dbt-cd.yml, which fires only when the dbt project
# directory changed). One run does BOTH halves of a deploy:
#
#   1. `databricks bundle deploy -t prod` at the merged SHA -- the DAB
#      components (jobs, schema, volume, docs app) redeploy themselves. The
#      deploy runs AS the production SP (this job's run_as identity), which
#      owns the prod root path, so no extra deployer identity or credential
#      exists anywhere.
#   2. Slim production build: `dbt build -s state:modified+ --fail-fast`
#      against the captured production state, then the state manifest is
#      refreshed so the next CI/CD diff compares against what is now live.
#      First deploy (no state yet) falls back to a full build. Finally,
#      `dbt docs generate` refreshes the hosted docs so the site always shows
#      what this deploy just shipped (not just the next scheduled docs run),
#      and `bundle run dbt_docs` ships docs_app/ code changes -- bundle deploy
#      alone updates the app resource but never deploys app code (#80).
#
# Like CI, the task downloads the repo tarball at `git_ref` -- prod deploys
# exactly the merged commit, not whatever happens to be synced anywhere.
resources:
  jobs:
    dbt_cd:
      name: dbt CD
      description: >-
        On merge to production: redeploys the bundle at the merged SHA, then
        slim-builds only changed models (state:modified+) and refreshes
        captured production state and the hosted dbt docs. Triggered by
        GitHub Actions; never scheduled.
      # deploys must serialize -- two concurrent bundle deploys corrupt nothing
      # but the loser's terraform lock makes the run fail confusingly
      max_concurrent_runs: 1
      permissions:
        - group_name: users
          level: CAN_VIEW
        # The GitHub Actions runner app's SP may ONLY trigger runs of this job
        # (same trigger-only role it has on dbt CI).
        - service_principal_name: ${var.ci_trigger_principal}
          level: CAN_MANAGE_RUN
      parameters:
        - name: git_ref
          default: main
      tasks:
        - task_key: dbt_cd
          spark_python_task:
            python_file: ../scripts/databricks_dbt_runner.py
            parameters:
              - "--mode=cd"
              - "--git-ref={{job.parameters.git_ref}}"
              - "--warehouse-id=${var.warehouse_id}"
              - "--catalog=${var.production_catalog}"
              - "--schema=${var.production_schema}"
              - "--artifacts-volume=/Volumes/${var.production_catalog}/${var.production_artifact_schema}/${var.production_artifact_volume}"
          environment_key: dbt_via_uv
          timeout_seconds: 3600
      environments:
        - environment_key: dbt_via_uv
          spec:
            environment_version: "3"
            # no dbt here on purpose -- `uv sync` installs the pyproject-pinned
            # version inside the task
            dependencies:
              - uv
              - databricks-sdk
