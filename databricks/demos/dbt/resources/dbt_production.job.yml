# Production daily job. Serverless Python tasks running dbt VIA UV rather than
# the managed dbt task type, on purpose:
#   * pyproject.toml pins the dbt version for every environment -- upgrading dbt
#     is a one-line PR, never a job-definition edit;
#   * auth is the job's run_as SP resolved at runtime from the task's ambient
#     credentials (no OAuth secret provisioned anywhere);
#   * the committed profiles.yml is the single profile definition for
#     dev/ci/prod -- no platform-generated profile to drift from it.
resources:
  jobs:
    dbt_production_daily:
      # Short human-readable name on purpose (the Jobs UI is cramped); the
      # owning repo / env / deploy date live in tags.
      name: dbt Daily
      description: Checks source freshness, builds the daily-tagged models, captures production state, and regenerates docs.
      permissions:
        - group_name: users
          level: CAN_VIEW
        # Setting ANY permissions here replaces the grant the app resource would
        # otherwise add for itself -- so re-grant the docs app's service principal
        # explicitly (bundle validate warns about exactly this).
        - service_principal_name: ${resources.apps.dbt_docs.service_principal_client_id}
          level: CAN_VIEW
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
      tasks:
        # Source freshness runs FIRST and fails the run when system.billing is stale.
        # The singular correctness tests anchor on max(usage_date) -- a relative check --
        # so without this absolute check a stalled pipeline could stay green for weeks.
        - task_key: dbt_source_freshness
          spark_python_task:
            python_file: ../scripts/databricks_dbt_runner.py
            parameters:
              - "--mode=prod-source-freshness"
              - "--project-dir=${workspace.file_path}"
              - "--warehouse-id=${var.warehouse_id}"
              - "--catalog=${var.production_catalog}"
              - "--schema=${var.production_schema}"
          environment_key: dbt_via_uv
        - task_key: dbt_build_daily
          depends_on:
            - task_key: dbt_source_freshness
          spark_python_task:
            python_file: ../scripts/databricks_dbt_runner.py
            parameters:
              - "--mode=prod-build"
              - "--project-dir=${workspace.file_path}"
              - "--warehouse-id=${var.warehouse_id}"
              - "--catalog=${var.production_catalog}"
              - "--schema=${var.production_schema}"
              - "--artifacts-volume=/Volumes/${var.production_catalog}/${var.production_artifact_schema}/${var.production_artifact_volume}"
          environment_key: dbt_via_uv
        - task_key: dbt_generate_docs
          depends_on:
            - task_key: dbt_build_daily
          run_if: ALL_DONE
          spark_python_task:
            python_file: ../scripts/databricks_dbt_runner.py
            parameters:
              - "--mode=prod-docs"
              - "--project-dir=${workspace.file_path}"
              - "--warehouse-id=${var.warehouse_id}"
              - "--catalog=${var.production_catalog}"
              - "--schema=${var.production_schema}"
              - "--artifacts-volume=/Volumes/${var.production_catalog}/${var.production_artifact_schema}/${var.production_artifact_volume}"
          environment_key: dbt_via_uv
      environments:
        - environment_key: dbt_via_uv
          spec:
            environment_version: "3"
            # no dbt here on purpose -- `uv sync` installs the pyproject-pinned
            # version inside the task (see header comment)
            dependencies:
              - uv
              - databricks-sdk
