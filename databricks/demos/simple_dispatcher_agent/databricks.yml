bundle:
  name: simple_dispatcher_agent

workspace:
  profile: DEFAULT

variables:
  base_catalog:
    description: Catalog hosting the registered dispatcher model and its UC-backed traces.
    default: rpw_prod
  base_schema:
    description: >
      Schema base name.
      - dev: a per-user short name is appended (`_<short_name>`).
      - test: a PR number is appended (`_<pr_number>`).
      - prod: used unchanged.
    default: simple_dispatcher
  luna_model:
    description: Default model, also for low-intelligence / high-context work (cheap and fast).
    default: system.ai.gpt-6-luna
  opus_model:
    description: High-intelligence model.
    default: system.ai.claude-opus-5-5
  argon_model:
    description: Visual design, real-world 3D/spatial reasoning, and high-quality written copy.
    default: system.ai.gemini-4-argon
  jev_model:
    description: The router. A JEV judge model that picks luna, opus, or argon per request.
    default: system.ai.openjev-qwen35-4b
  secret_scope:
    description: >
      Secret scope with `client_id` / `client_secret` of the service principal
      the serving endpoint runs as. Model Serving can't pass its own credential
      through to Unity AI Gateway model services, so deploys need one.
    default: simple_dispatcher_agent
  pr_number:
    description: PR number suffix for the `test` target (CI only).
    default: "0"
  # Per-target derived values (set in each target's `variables` block).
  target_schema:
    description: Fully-resolved schema for the active target.
  target_experiment:
    description: MLflow experiment path for the active target.
  deploy_endpoint:
    description: Whether the deploy job should also create/refresh a serving endpoint.
    default: "false"

sync:
  include:
    - "agent.py"
    - "serving_agent.py"
    - "driver.py"

resources:
  jobs:
    deploy_dispatcher:
      # No schedule: this is a deploy-on-demand job, run via `databricks bundle run`.
      name: "Deploy Simple Model Dispatcher"
      tasks:
        - task_key: deploy
          spark_python_task:
            python_file: ./driver.py
            parameters:
              - "--catalog"
              - "${var.base_catalog}"
              - "--schema"
              - "${var.target_schema}"
              - "--luna-model"
              - "${var.luna_model}"
              - "--opus-model"
              - "${var.opus_model}"
              - "--argon-model"
              - "${var.argon_model}"
              - "--jev-model"
              - "${var.jev_model}"
              - "--experiment"
              - "${var.target_experiment}"
              - "--deploy-endpoint"
              - "${var.deploy_endpoint}"
              - "--secret-scope"
              - "${var.secret_scope}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - mlflow>=3.0
              - databricks-agents
              - databricks-sdk

targets:
  dev:
    default: true
    mode: development
    variables:
      target_schema: "${var.base_schema}_${workspace.current_user.short_name}"
      target_experiment: "/Users/${workspace.current_user.userName}/${bundle.name}_dev_${workspace.current_user.short_name}_${var.base_catalog}"
      deploy_endpoint: "false"
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundles/${bundle.name}
    presets:
      name_prefix: "[DEV - ${workspace.current_user.userName}] "

  test:
    # Development mode on purpose: it keeps schedules off (there are none here,
    # but it also avoids prod-mode guardrails for ephemeral PR deploys).
    mode: development
    variables:
      target_schema: "${var.base_schema}_${var.pr_number}"
      target_experiment: "/Users/${workspace.current_user.userName}/${bundle.name}_test_${var.pr_number}_${var.base_catalog}"
      deploy_endpoint: "false"
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundles/${bundle.name}/pr_${var.pr_number}
    presets:
      # `mode: development` requires the prefix to carry the user's short_name
      # for uniqueness, so the bare "[TEST] " the spec asked for won't validate.
      name_prefix: "[TEST - ${workspace.current_user.short_name}] "

  prod:
    mode: production
    variables:
      target_schema: "${var.base_schema}"
      target_experiment: "/Workspace/deployments/${bundle.name}/${bundle.name}_prod_${var.base_catalog}"
      deploy_endpoint: "true"
    workspace:
      root_path: /Workspace/deployments/${bundle.name}
    presets:
      name_prefix: "[PROD 🏋️] "
