# Lakewatch getting started: safely turn on Lakewatch (Beta) and deploy starter
# Databricks security infrastructure detections into YOUR workspace.
#
#   databricks bundle deploy                       # as a workspace admin
#   databricks bundle run rpw_lakewatch_getting_started
#
# Everything this bundle creates is prefixed rpw_ so it never overwrites existing objects.
bundle:
  name: lakewatch-getting-started

sync:
  # Gitignored files (.venv, __pycache__, uv.lock) are never synced.
  exclude:
    - tests/**

include:
  - resources/*.yml

variables:
  catalog:
    description: >
      Lakewatch environment catalog. If Lakewatch is not set up yet, the job creates this catalog on the
      metastore's default storage. If Lakewatch is already set up, set this to that environment's catalog.
    default: rpw_lakewatch
  schema:
    description: Lakewatch folder (schema) for this bundle's security infrastructure tables and rules.
    default: rpw_databricks_security_infra
  rules_enabled:
    description: Schedule the detection rules when registering them ("true"/"false"). Tune first.
    default: "false"
  allow_with_prior_preview:
    description: >
      Set up the Beta even if an earlier Lakewatch preview configuration exists ("true"/"false").
      Preview resources are never modified either way.
    default: "false"
  catalog_storage_root:
    description: >
      Only used if the job has to create the catalog and your metastore has no storage root: a cloud storage URL
      under an external location you can use (e.g. from `databricks external-locations list`). Empty = metastore default.
    default: ""
  dry_run:
    description: Only inspect and print the plan; change nothing ("true"/"false").
    default: "false"
  error_beacon:
    description: >
      Report only the setup outcome code (e.g. LWGS-E201 or ok) in the user agent of one API call, so the
      bundle's maintainers can see which setup errors are common and fix them. No error text or data. "true"/"false".
    default: "true"
  long_running_days:
    description: A cluster up longer than this many days fails the cluster-restart (patching) control.
    default: "30"
  max_token_days:
    description: Personal access tokens living longer than this many days fail credential hygiene.
    default: "90"

targets:
  # prod: the recommended first run. One copy per workspace, real names, daily schedule and rules on.
  prod:
    mode: production
    default: true
    workspace:
      # In the deployer's home folder (not /Workspace/Shared, which every user can write), since the job runs as admin.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      rules_enabled: "true"   # detection rules run on their schedules; dev keeps them off
  # dev: per-developer copies ("[dev you]" prefix, schedule paused) once this lives in your own git repo.
  dev:
    mode: development
