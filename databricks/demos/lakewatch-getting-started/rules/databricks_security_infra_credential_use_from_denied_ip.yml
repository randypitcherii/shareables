rule_name: databricks_security_infra_credential_use_from_denied_ip
description: Repeated requests from an IP address outside the IP access list for one identity, indicating a stolen credential used off-network.
severity: High
category: Credential Access
fidelity: FIDELITY_MEDIUM
objective: >
  When inbound access is restricted, a stolen PAT, OAuth secret, or service principal secret replayed from attacker
  infrastructure is denied and logged as IpAccessDenied. Bursts of denials for one identity are the earliest signal.
runbook: >
  Identify the identity and source IP. If the IP is not a known corporate egress or VPN, rotate or revoke the identity's
  PATs and OAuth secrets, review its recent successful activity, and check whether the same IP appears elsewhere.
schedule:
  at_least_every: 15m
batch:
  sql:
    query: |
      SELECT max(event_time) AS event_time, workspace_id,
             coalesce(request_params.user, user_identity.email) AS identity, source_ip_address AS src_ip,
             count(*) AS denied_requests, collect_set(request_params.path) AS paths, any_value(user_agent) AS user_agent
      FROM system.access.audit
      WHERE IN_TIMERANGE(event_time) AND action_name = 'IpAccessDenied'
      GROUP BY workspace_id, coalesce(request_params.user, user_identity.email), source_ip_address
      HAVING count(*) >= 20
output:
  event_time_column: event_time
  summary: "{denied_requests} requests from non-allowlisted IP {src_ip} for {identity}"
  context:
    workspace_id: "{workspace_id}"
    identity: "{identity}"
    src_ip: "{src_ip}"
    user_agent: "{user_agent}"
deduplication: DEDUPLICATION_ENABLED
deduplication_time_window: 24 hours
mitre:
  - taxonomy: Enterprise
    tactic: Initial Access
    technique_id: T1078
    technique: Valid Accounts
    sub_technique_id: T1078.004
    sub_technique: Cloud Accounts
