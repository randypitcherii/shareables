[project]
name = "multi-claude-subscription-unity-gateway"
version = "2026.11.501"
description = "N Claude subscriptions behind one Unity Gateway, shared in Omnigent — experiment harness."
requires-python = ">=3.11"
dependencies = ["databricks-sdk>=0.60"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
